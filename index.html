<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taskly — Your Day, Sorted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">

</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <h1>Taskly</h1>
      <p>Your day, sorted — nothing fancy, just done.</p>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button">🌙 Dark</button>
  </header>

  <div class="stat-row">
    <div class="stat">
      <div class="num" id="stat-total">0</div>
      <div class="label">Total tasks</div>
    </div>
    <div class="stat pending">
      <div class="num" id="stat-pending">0</div>
      <div class="label">In progress</div>
    </div>
    <div class="stat done">
      <div class="num" id="stat-done">0</div>
      <div class="label">Completed</div>
    </div>
  </div>

  <form id="task-form" novalidate>
    <div class="field-row">
      <input type="text" id="task-input" placeholder="What needs doing?" maxlength="120">
      <select id="priority-input">
        <option value="medium">Medium priority</option>
        <option value="high">High priority</option>
        <option value="low">Low priority</option>
      </select>
      <input type="date" id="due-input">
      <button type="submit" class="add-btn">Add task</button>
    </div>
    <div class="error-msg" id="error-msg"></div>
  </form>

  <div class="filters" id="filters">
    <button data-filter="all" class="active" type="button">All</button>
    <button data-filter="active" type="button">Active</button>
    <button data-filter="completed" type="button">Completed</button>
  </div>

  <ul id="task-list"></ul>

  <div class="empty-state" id="empty-state" style="display:none;">
    <div class="emoji">🌤️</div>
    <p id="empty-text">Nothing here yet — add your first task above.</p>
  </div>

  <footer class="note">Saved automatically in this browser · Taskly</footer>
</div>

<script src="scripts/main.js"></script>

</body>
</html>
